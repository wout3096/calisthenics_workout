<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CALISTHENICS | Coaching</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #101214;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 22px 8%;
    border-bottom: 1px solid #30363a;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 23px;
    font-weight: 900;
}

.logo span { color: #a3e635; }

.container {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

h1 { font-size: 35px; }

.subtitle, .muted { color: #92999e; }

.panel {
    background: #191d20;
    border: 1px solid #30363a;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
}

input, select {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    background: #101214;
    border: 1px solid #363d42;
    border-radius: 7px;
    color: white;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 7px;
    background: #a3e635;
    color: #101214;
    font-weight: bold;
    cursor: pointer;
    margin: 5px 3px;
}

.secondary {
    background: #30383d;
    color: white;
}

.hidden { display: none !important; }

.error {
    color: #ff7777;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.success { color: #a3e635; }

.exercise {
    background: #252b2f;
    padding: 15px;
    border-radius: 8px;
    margin: 10px 0;
}

.exercise label {
    display: flex;
    align-items: center;
    gap: 12px;
}

.exercise input {
    width: 20px;
    accent-color: #a3e635;
}

.done {
    text-decoration: line-through;
    opacity: .5;
}

.progress-bg {
    background: #343b40;
    height: 9px;
    border-radius: 10px;
    margin-top: 12px;
}

.progress {
    background: #a3e635;
    height: 9px;
    border-radius: 10px;
}

</style>
</head>

<body>

<header>
    <div class="logo">CALIS<span>THENICS.</span></div>
    <button id="logout" class="secondary hidden">LOG OUT</button>
</header>

<div class="container">

    <!-- LOGIN -->

    <section id="loginSection">

        <h1>WELCOME.</h1>
        <p class="subtitle">Your calisthenics journey starts here.</p>

        <div class="panel">

            <h2>Login / Register</h2>

            <input id="email" type="email" placeholder="Email">

            <input id="password" type="password"
                   placeholder="Password">

            <button id="loginBtn">LOGIN</button>

            <button id="registerBtn" class="secondary">
                CREATE ACCOUNT
            </button>

            <p id="authMessage" class="muted"></p>

        </div>

    </section>


    <!-- DASHBOARD -->

    <section id="dashboard" class="hidden">

        <h1 id="welcome">DASHBOARD</h1>

        <p id="roleText" class="subtitle"></p>

        <p id="dashboardMessage" class="error"></p>


        <!-- COACH -->

        <section id="coachPanel" class="hidden">

            <div class="panel">

                <h2>Create Workout</h2>

                <input id="workoutTitle"
                       placeholder="Workout name">

                <button id="createWorkoutBtn">
                    CREATE WORKOUT
                </button>

            </div>


            <div class="panel">

                <h2>Add Exercise</h2>

                <select id="workoutSelect"></select>

                <input id="exerciseName"
                       placeholder="Exercise name">

                <input id="sets" type="number"
                       min="1" placeholder="Sets">

                <input id="reps"
                       placeholder="Reps (e.g. 12 or 30 sec)">

                <button id="addExerciseBtn">
                    ADD EXERCISE
                </button>

            </div>


            <div class="panel">

                <h2>Assign Workout To Client</h2>

                <select id="clientSelect"></select>

                <select id="assignWorkout"></select>

                <button id="assignWorkoutBtn">
                    ASSIGN WORKOUT
                </button>

            </div>


            <div class="panel">

                <h2>Client Progress</h2>

                <div id="clientProgress"></div>

            </div>

        </section>


        <!-- CLIENT -->

        <section id="clientPanel" class="hidden">

            <h2>MY WORKOUTS</h2>

            <div id="myWorkouts"></div>

        </section>

    </section>

</div>


<script>

// ==========================================
// SUPABASE CONFIGURATION
// ==========================================

const SUPABASE_URL =
"https://uaxfxkkpfnxfgjdwilko.supabase.co";

const SUPABASE_KEY =
"sb_publishable_faulfh5FiEqNlLSWgpFv_A_ZspjYk1z";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ==========================================
// VARIABLES
// ==========================================

let user = null;
let profile = null;
let workouts = [];

let loading = false;


// ==========================================
// ELEMENTS
// ==========================================

const $ = id => document.getElementById(id);

function showMessage(id, text, type = "error") {
    $(id).textContent = text;
    $(id).className = type;
}

function showError(error) {
    return [
        error.message || "Unknown error",
        error.code ? "Code: " + error.code : "",
        error.details || "",
        error.hint || ""
    ].filter(Boolean).join("\n");
}


// ==========================================
// LOGIN
// ==========================================

async function login() {

    const email = $("email").value.trim();
    const password = $("password").value;

    if (!email || !password) {
        showMessage("authMessage", "Enter your email and password.");
        return;
    }

    showMessage("authMessage", "Logging in...", "muted");

    const { error } = await db.auth.signInWithPassword({
        email,
        password
    });

    if (error) {
        showMessage("authMessage", showError(error));
        return;
    }

    await loadApp();

}


// ==========================================
// REGISTER
// ==========================================

async function register() {

    const email = $("email").value.trim();
    const password = $("password").value;

    if (!email || !password) {
        showMessage("authMessage", "Enter your email and password.");
        return;
    }

    if (password.length < 8) {
        showMessage("authMessage", "Password must be at least 8 characters.");
        return;
    }

    showMessage("authMessage", "Creating account...", "muted");

    const { data, error } = await db.auth.signUp({
        email,
        password
    });

    if (error) {
        showMessage("authMessage", showError(error));
        return;
    }

    if (data.session) {
        showMessage("authMessage", "Account created!", "success");
        await loadApp();
    } else {
        showMessage(
            "authMessage",
            "Account created! Check your email to confirm your account, then log in.",
            "success"
        );
    }

}


// ==========================================
// LOGOUT
// ==========================================

async function logout() {

    const { error } = await db.auth.signOut();

    if (error) {
        alert(showError(error));
        return;
    }

    user = null;
    profile = null;

    $("dashboard").classList.add("hidden");
    $("loginSection").classList.remove("hidden");
    $("logout").classList.add("hidden");
    $("coachPanel").classList.add("hidden");
    $("clientPanel").classList.add("hidden");

}


// ==========================================
// LOAD APPLICATION
// ==========================================

async function loadApp() {

    if (loading) return;

    loading = true;

    try {

        showMessage("dashboardMessage", "");

        const { data, error: authError } =
            await db.auth.getUser();

        if (authError) throw authError;

        user = data.user;

        if (!user) {

            $("dashboard").classList.add("hidden");
            $("loginSection").classList.remove("hidden");

            return;
        }


        // LOAD PROFILE

        const { data: p, error } = await db
            .from("profiles")
            .select("id,email,role")
            .eq("id", user.id)
            .maybeSingle();

        if (error) {
            throw error;
        }

        if (!p) {
            throw new Error(
                "Your account exists, but no matching profile was found. Check your profiles table and profile creation trigger."
            );
        }

        profile = p;


        // SHOW DASHBOARD

        $("loginSection").classList.add("hidden");
        $("dashboard").classList.remove("hidden");
        $("logout").classList.remove("hidden");

        $("welcome").textContent =
            "WELCOME, " + user.email.split("@")[0].toUpperCase();


        if (profile.role === "coach") {

            $("roleText").textContent = "COACH DASHBOARD";

            $("coachPanel").classList.remove("hidden");
            $("clientPanel").classList.add("hidden");

            await loadCoach();

        } else {

            $("roleText").textContent = "YOUR TRAINING DASHBOARD";

            $("clientPanel").classList.remove("hidden");
            $("coachPanel").classList.add("hidden");

            await loadClient();

        }

    } catch (error) {

        console.error("Application error:", error);

        $("dashboard").classList.add("hidden");
        $("loginSection").classList.remove("hidden");

        showMessage(
            "authMessage",
            "ERROR LOADING PROFILE:\n" + showError(error)
        );

    } finally {

        loading = false;

    }

}


// ==========================================
// LOAD COACH DASHBOARD
// ==========================================

async function loadCoach() {

    const { data: w, error } = await db
        .from("workouts")
        .select("*")
        .order("title");

    if (error) throw error;

    workouts = w || [];

    $("workoutSelect").innerHTML = "";
    $("assignWorkout").innerHTML = "";

    workouts.forEach(workout => {

        $("workoutSelect").add(
            new Option(workout.title, workout.id)
        );

        $("assignWorkout").add(
            new Option(workout.title, workout.id)
        );

    });


    const { data: clients, error: clientError } = await db
        .from("profiles")
        .select("id,email")
        .eq("role", "client");

    if (clientError) throw clientError;

    $("clientSelect").innerHTML = "";

    (clients || []).forEach(client => {

        $("clientSelect").add(
            new Option(client.email, client.id)
        );

    });

    await showProgress();

}


// ==========================================
// CREATE WORKOUT
// ==========================================

async function createWorkout() {

    const title = $("workoutTitle").value.trim();

    if (!title) {
        alert("Enter a workout name.");
        return;
    }

    const { error } = await db
        .from("workouts")
        .insert({
            title,
            created_by: user.id
        });

    if (error) {
        alert(showError(error));
        return;
    }

    $("workoutTitle").value = "";

    await loadCoach();

    alert("Workout created!");

}


// ==========================================
// ADD EXERCISE
// ==========================================

async function addExercise() {

    const workoutId = $("workoutSelect").value;
    const name = $("exerciseName").value.trim();
    const sets = Number($("sets").value);
    const reps = $("reps").value.trim();

    if (!workoutId || !name || !sets || !reps) {
        alert("Fill in all exercise details.");
        return;
    }

    const { error } = await db
        .from("exercises")
        .insert({
            workout_id: workoutId,
            name,
            sets,
            reps
        });

    if (error) {
        alert(showError(error));
        return;
    }

    $("exerciseName").value = "";
    $("sets").value = "";
    $("reps").value = "";

    alert("Exercise added!");

}


// ==========================================
// ASSIGN WORKOUT
// ==========================================

async function assignWorkout() {

    const clientId = $("clientSelect").value;
    const workoutId = $("assignWorkout").value;

    if (!clientId || !workoutId) {
        alert("Select a client and workout.");
        return;
    }

    const { error } = await db
        .from("assignments")
        .insert({
            workout_id: workoutId,
            client_id: clientId,
            assigned_by: user.id
        });

    if (error) {
        alert(showError(error));
        return;
    }

    alert("Workout assigned!");

    await showProgress();

}


// ==========================================
// CLIENT PROGRESS
// ==========================================

async function showProgress() {

    const container = $("clientProgress");

    container.innerHTML = "Loading progress...";

    const { data: assignments, error } = await db
        .from("assignments")
        .select("*");

    if (error) throw error;

    container.innerHTML = "";

    for (const assignment of assignments || []) {

        const { data: client } = await db
            .from("profiles")
            .select("email")
            .eq("id", assignment.client_id)
            .maybeSingle();

        const { data: workout } = await db
            .from("workouts")
            .select("title")
            .eq("id", assignment.workout_id)
            .maybeSingle();

        const { data: exercises } = await db
            .from("exercises")
            .select("id")
            .eq("workout_id", assignment.workout_id);

        const { data: completed } = await db
            .from("completions")
            .select("id")
            .eq("assignment_id", assignment.id)
            .eq("completed", true);

        const total = exercises?.length || 0;
        const done = completed?.length || 0;

        const div = document.createElement("div");
        div.className = "exercise";

        const title = document.createElement("strong");
        title.textContent = client?.email || "Client";

        const detail = document.createElement("p");
        detail.className = "muted";

        detail.textContent =
            (workout?.title || "Workout") +
            " — " + done + "/" + total + " completed";

        div.append(title, detail);
        container.append(div);

    }

}


// ==========================================
// CLIENT DASHBOARD
// ==========================================

async function loadClient() {

    const container = $("myWorkouts");

    container.innerHTML = "Loading workouts...";

    const { data: assignments, error } = await db
        .from("assignments")
        .select("*")
        .eq("client_id", user.id);

    if (error) throw error;

    container.innerHTML = "";

    if (!assignments || assignments.length === 0) {

        container.textContent =
            "You don't have any workouts assigned yet.";

        return;
    }


    for (const assignment of assignments) {

        const { data: workout, error: workoutError } = await db
            .from("workouts")
            .select("title")
            .eq("id", assignment.workout_id)
            .maybeSingle();

        if (workoutError) throw workoutError;

        const { data: exercises, error: exerciseError } = await db
            .from("exercises")
            .select("*")
            .eq("workout_id", assignment.workout_id)
            .order("position");

        if (exerciseError) throw exerciseError;

        const { data: completions, error: completionError } = await db
            .from("completions")
            .select("*")
            .eq("assignment_id", assignment.id);

        if (completionError) throw completionError;


        const completedIds = new Set(
            (completions || [])
                .filter(c => c.completed)
                .map(c => c.exercise_id)
        );

        const card = document.createElement("div");
        card.className = "panel";

        const title = document.createElement("h2");
        title.textContent = workout?.title || "Workout";

        card.append(title);


        const total = exercises?.length || 0;

        for (const exercise of exercises || []) {

            const row = document.createElement("div");
            row.className = "exercise";

            const label = document.createElement("label");

            const checkbox = document.createElement("input");

            checkbox.type = "checkbox";
            checkbox.checked = completedIds.has(exercise.id);

            const text = document.createElement("span");

            text.textContent =
                exercise.name + " — " +
                exercise.sets + " sets × " +
                exercise.reps;

            if (checkbox.checked) {
                text.classList.add("done");
            }

            checkbox.onchange = async () => {

                const { error } = await db
                    .from("completions")
                    .upsert({
                        assignment_id: assignment.id,
                        exercise_id: exercise.id,
                        completed: checkbox.checked
                    }, {
                        onConflict: "assignment_id,exercise_id"
                    });

                if (error) {
                    alert(showError(error));
                    checkbox.checked = !checkbox.checked;
                    return;
                }

                await loadClient();

            };

            label.append(checkbox, text);
            row.append(label);
            card.append(row);

        }


        const done = exercises?.filter(e =>
            completedIds.has(e.id)
        ).length || 0;

        const percentage = total
            ? Math.round(done / total * 100)
            : 0;

        const progressText = document.createElement("p");

        progressText.className = "muted";

        progressText.textContent =
            done + "/" + total +
            " exercises completed — " +
            percentage + "%";


        const bg = document.createElement("div");
        bg.className = "progress-bg";

        const bar = document.createElement("div");
        bar.className = "progress";
        bar.style.width = percentage + "%";

        bg.append(bar);

        card.append(bg, progressText);

        container.append(card);

    }

}


// ==========================================
// BUTTON EVENTS
// ==========================================

$("loginBtn").addEventListener("click", login);

$("registerBtn").addEventListener("click", register);

$("logout").addEventListener("click", logout);

$("createWorkoutBtn").addEventListener("click", createWorkout);

$("addExerciseBtn").addEventListener("click", addExercise);

$("assignWorkoutBtn").addEventListener("click", assignWorkout);


// ==========================================
// RESTORE EXISTING SESSION
// ==========================================

async function startApp() {

    const { data, error } = await db.auth.getSession();

    if (error) {
        showMessage("authMessage", showError(error));
        return;
    }

    if (data.session) {
        await loadApp();
    }

}

db.auth.onAuthStateChange((event, session) => {

    if (event === "SIGNED_OUT") {

        user = null;
        profile = null;

        $("dashboard").classList.add("hidden");
        $("loginSection").classList.remove("hidden");
        $("logout").classList.add("hidden");

    }

});

startApp();

</script>

</body>
</html>
