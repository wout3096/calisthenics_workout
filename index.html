<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CALISTHENICS | Coaching</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101214;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 25px 8%;
    border-bottom: 1px solid #30363a;
    display: flex;
    justify-content: space-between;
}

.logo {
    font-size: 23px;
    font-weight: 900;
}

.logo span {
    color: #a3e635;
}

.container {
    max-width: 900px;
    margin: 45px auto;
    padding: 20px;
}

h1 {
    font-size: 35px;
}

.subtitle {
    color: #92999e;
    margin-bottom: 35px;
}

.panel {
    background: #191d20;
    border: 1px solid #30363a;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 20px;
}

input, select {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    background: #101214;
    border: 1px solid #363d42;
    border-radius: 7px;
    color: white;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 7px;
    background: #a3e635;
    color: #101214;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.secondary {
    background: #30383d;
    color: white;
}

.danger {
    background: #54272b;
    color: white;
}

.exercise {
    background: #252b2f;
    padding: 15px;
    border-radius: 8px;
    margin: 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.exercise label {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    cursor: pointer;
}

.exercise input {
    width: 20px;
    accent-color: #a3e635;
}

.done {
    opacity: 0.5;
    text-decoration: line-through;
}

.progress-bg {
    background: #343b40;
    height: 8px;
    border-radius: 10px;
    margin-top: 15px;
}

.progress {
    background: #a3e635;
    height: 8px;
    border-radius: 10px;
}

.hidden {
    display: none;
}

.muted {
    color: #92999e;
    font-size: 13px;
}

</style>
</head>

<body>

<header>
    <div class="logo">CALIS<span>THENICS.</span></div>
    <button id="logout" class="secondary hidden"
    onclick="logout()">LOG OUT</button>
</header>

<div class="container">

<section id="loginSection">

    <h1>WELCOME.</h1>
    <p class="subtitle">Your calisthenics journey starts here.</p>

    <div class="panel">

        <h2>Login / Register</h2>

        <input id="email" type="email" placeholder="Email">

        <input id="password" type="password"
        placeholder="Password">

        <button onclick="login()">LOGIN</button>

        <button class="secondary"
        onclick="register()">CREATE ACCOUNT</button>

        <p id="authMessage" class="muted"></p>

    </div>

</section>


<section id="dashboard" class="hidden">

    <h1 id="welcome">DASHBOARD</h1>
    <p class="subtitle" id="roleText"></p>

    <section id="coachPanel" class="hidden">

        <div class="panel">

            <h2>Create Workout</h2>

            <input id="workoutTitle"
            placeholder="Workout name">

            <button onclick="createWorkout()">
                CREATE WORKOUT
            </button>

        </div>

        <div class="panel">

            <h2>Add Exercise</h2>

            <select id="workoutSelect"></select>

            <input id="exerciseName"
            placeholder="Exercise name">

            <input id="sets" type="number"
            min="1" placeholder="Sets">

            <input id="reps"
            placeholder="Reps (e.g. 12 or 30 sec)">

            <button onclick="addExercise()">
                ADD EXERCISE
            </button>

        </div>

        <div class="panel">

            <h2>Assign Workout To Client</h2>

            <select id="clientSelect"></select>

            <select id="assignWorkout"></select>

            <button onclick="assignWorkout()">
                ASSIGN WORKOUT
            </button>

        </div>

        <div class="panel">

            <h2>Client Progress</h2>

            <div id="clientProgress"></div>

        </div>

    </section>


    <section id="clientPanel" class="hidden">

        <h2>MY WORKOUTS</h2>

        <div id="myWorkouts"></div>

    </section>

</section>

</div>


<script>

// IMPORTANT: INSERT YOUR SUPABASE DETAILS HERE

const SUPABASE_URL = "https://uaxfxkkpfnxfgjdwilko.supabase.co";

const SUPABASE_KEY = "sb_publishable_faulfh5FiEqNlLSWgpFv_A_ZspjYk1z";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let user = null;
let profile = null;
let workouts = [];


async function login() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const {error} = await db.auth.signInWithPassword({
        email,
        password
    });

    if(error) {
        message(error.message);
        return;
    }

    await loadApp();
}


async function register() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if(password.length < 8) {
        message("Password must be at least 8 characters.");
        return;
    }

    const {error} = await db.auth.signUp({
        email,
        password
    });

    if(error) {
        message(error.message);
        return;
    }

    message("Account created! Check your email to confirm registration, then log in.");
}


function message(text) {
    document.getElementById("authMessage").textContent = text;
}


async function logout() {

    await db.auth.signOut();

    location.reload();

}


async function loadApp() {

    const {data} = await db.auth.getUser();

    user = data.user;

    if(!user) return;

    const {data: p, error} = await db
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .single();

    if(error || !p) {
        alert("Could not load your profile.");
        return;
    }

    profile = p;

    document.getElementById("loginSection")
        .classList.add("hidden");

    document.getElementById("dashboard")
        .classList.remove("hidden");

    document.getElementById("logout")
        .classList.remove("hidden");

    document.getElementById("welcome").textContent =
        "WELCOME, " + user.email.split("@")[0].toUpperCase();

    if(profile.role === "coach") {

        document.getElementById("roleText").textContent =
            "COACH DASHBOARD";

        document.getElementById("coachPanel")
            .classList.remove("hidden");

        await loadCoach();

    } else {

        document.getElementById("roleText").textContent =
            "YOUR TRAINING DASHBOARD";

        document.getElementById("clientPanel")
            .classList.remove("hidden");

        await loadClient();

    }

}


async function loadCoach() {

    const {data: w, error} = await db
        .from("workouts")
        .select("*")
        .order("title");

    if(error) {
        alert(error.message);
        return;
    }

    workouts = w || [];

    const workoutSelect = document.getElementById("workoutSelect");
    const assignSelect = document.getElementById("assignWorkout");

    workoutSelect.innerHTML = "";
    assignSelect.innerHTML = "";

    workouts.forEach(workout => {

        const a = new Option(workout.title, workout.id);
        const b = new Option(workout.title, workout.id);

        workoutSelect.add(a);
        assignSelect.add(b);

    });


    const {data: clients, error: clientError} = await db
        .from("profiles")
        .select("*")
        .eq("role", "client");

    if(clientError) {
        alert(clientError.message);
        return;
    }

    const clientSelect = document.getElementById("clientSelect");

    clientSelect.innerHTML = "";

    clients.forEach(client => {

        clientSelect.add(
            new Option(client.email, client.id)
        );

    });

    await showProgress();

}


async function createWorkout() {

    const title = document.getElementById("workoutTitle").value.trim();

    if(!title) {
        alert("Enter a workout name.");
        return;
    }

    const {error} = await db.from("workouts").insert({
        title: title,
        created_by: user.id
    });

    if(error) {
        alert(error.message);
        return;
    }

    document.getElementById("workoutTitle").value = "";

    await loadCoach();

    alert("Workout created!");

}


async function addExercise() {

    const workoutId =
        document.getElementById("workoutSelect").value;

    const name =
        document.getElementById("exerciseName").value.trim();

    const sets =
        Number(document.getElementById("sets").value);

    const reps =
        document.getElementById("reps").value.trim();

    if(!workoutId || !name || !sets || sets < 1 || !reps) {
        alert("Fill in all exercise details.");
        return;
    }

    const {error} = await db.from("exercises").insert({
        workout_id: workoutId,
        name: name,
        sets: sets,
        reps: reps
    });

    if(error) {
        alert(error.message);
        return;
    }

    document.getElementById("exerciseName").value = "";
    document.getElementById("sets").value = "";
    document.getElementById("reps").value = "";

    alert("Exercise added!");

}


async function assignWorkout() {

    const clientId =
        document.getElementById("clientSelect").value;

    const workoutId =
        document.getElementById("assignWorkout").value;

    if(!clientId || !workoutId) {
        alert("Select a client and workout.");
        return;
    }

    const {error} = await db.from("assignments").insert({
        workout_id: workoutId,
        client_id: clientId,
        assigned_by: user.id
    });

    if(error) {
        alert(error.message);
        return;
    }

    alert("Workout successfully assigned!");

    await showProgress();

}


async function showProgress() {

    const {data: assignments, error} = await db
        .from("assignments")
        .select("id, client_id, workout_id, profiles(email), workouts(title)");

    if(error) {
        document.getElementById("clientProgress").textContent =
            error.message;
        return;
    }

    const container = document.getElementById("clientProgress");

    container.innerHTML = "";

    for(const assignment of assignments || []) {

        const {data: exercises} = await db
            .from("exercises")
            .select("id")
            .eq("workout_id", assignment.workout_id);

        const {data: completed} = await db
            .from("completions")
            .select("id")
            .eq("assignment_id", assignment.id)
            .eq("completed", true);

        const total = exercises?.length || 0;
        const done = completed?.length || 0;

        const div = document.createElement("div");
        div.className = "exercise";

        const info = document.createElement("div");

        const title = document.createElement("strong");
        title.textContent = assignment.profiles.email;

        const detail = document.createElement("p");
        detail.className = "muted";
        detail.textContent =
            assignment.workouts.title + " — " + done + "/" + total + " completed";

        info.append(title, detail);
        div.append(info);
        container.append(div);

    }

}


async function loadClient() {

    const {data: assignments, error} = await db
        .from("assignments")
        .select("id, workout_id, workouts(title)")
        .eq("client_id", user.id);

    const container = document.getElementById("myWorkouts");

    container.innerHTML = "";

    if(error) {
        container.textContent = error.message;
        return;
    }

    if(!assignments || assignments.length === 0) {
        container.textContent =
            "You don't have any workouts assigned yet.";
        return;
    }

    for(const assignment of assignments) {

        const {data: exercises} = await db
            .from("exercises")
            .select("*")
            .eq("workout_id", assignment.workout_id)
            .order("position");

        const {data: completions} = await db
            .from("completions")
            .select("*")
            .eq("assignment_id", assignment.id);

        const completedIds = new Set(
            (completions || [])
                .filter(c => c.completed)
                .map(c => c.exercise_id)
        );

        const card = document.createElement("div");
        card.className = "panel";

        const title = document.createElement("h2");
        title.textContent = assignment.workouts.title;

        card.append(title);

        const total = exercises?.length || 0;

        const done = exercises?.filter(e =>
            completedIds.has(e.id)
        ).length || 0;

        for(const exercise of exercises || []) {

            const row = document.createElement("div");
            row.className = "exercise";

            const label = document.createElement("label");

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = completedIds.has(exercise.id);

            const text = document.createElement("span");

            text.textContent =
                exercise.name + " — " +
                exercise.sets + " sets × " + exercise.reps;

            if(checkbox.checked) {
                text.classList.add("done");
            }

            checkbox.onchange = async () => {

                const {error} = await db
                    .from("completions")
                    .upsert({
                        assignment_id: assignment.id,
                        exercise_id: exercise.id,
                        completed: checkbox.checked
                    }, {
                        onConflict: "assignment_id,exercise_id"
                    });

                if(error) {
                    alert(error.message);
                    return;
                }

                await loadClient();

            };

            label.append(checkbox, text);
            row.append(label);
            card.append(row);

        }

        const percentage = total
            ? Math.round(done / total * 100)
            : 0;

        const progressText = document.createElement("p");
        progressText.className = "muted";
        progressText.textContent =
            done + "/" + total + " exercises completed — " +
            percentage + "%";

        const bg = document.createElement("div");
        bg.className = "progress-bg";

        const bar = document.createElement("div");
        bar.className = "progress";
        bar.style.width = percentage + "%";

        bg.append(bar);

        card.append(bg, progressText);
        container.append(card);

    }

}


// Restore login when the page is refreshed.

db.auth.onAuthStateChange((event, session) => {
    if(session) {
        setTimeout(() => loadApp(), 0);
    }
});

loadApp();

</script>

</body>
</html>
